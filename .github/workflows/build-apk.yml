# Builds the APK on every push to main and publishes it as the "latest"
# release, so the newest build is always at:
#   https://github.com/<owner>/<repo>/releases/download/latest/Passage.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Gradle 8.1 (from SDL's template) runs on Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Passage.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Passage.apk \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap Passage.apk to install."
